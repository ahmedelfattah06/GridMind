[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmind"
version = "0.1.0"
description = "Multi-agent smart energy trading and optimization simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Academic project" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "networkx>=3.2",
    "streamlit>=1.30",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = ["black>=24.1"]

[tool.setuptools]
packages = ["agents", "ai", "core", "experiments", "market", "ui"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
