# GridMind - official scenario catalogue (Team A3)
# -----------------------------------------------------------------------------
# Owner: A3 (Events, Tests, Scope Guard).
#
# An event is active on the half-open step interval [start, start + duration).
# Timings and intensities follow section 8 of the GridMind project guide:
#   day 3 = steps 72..95, hour 14 = step 86.
#
# Supported parameters (see core/events.py):
#   demand_multiplier: mapping of consumer type or agent id -> factor
#   capacity_factor:   mapping of producer type or agent id -> factor
#   cloud_override:    cloud cover in [0, 1] applied while the event is active
#
# Only the five official scenarios are allowed; do not invent additional ones.
# -----------------------------------------------------------------------------

scenarios:
  normal:
    description: Baseline operation without disruptions.
    events: []

  plant_outage:
    description: The thermal plant trips to 30 % capacity for 12 hours.
    events:
      - name: thermal_outage
        start: 86
        duration: 12
        params:
          capacity_factor:
            thermal: 0.3

  demand_spike:
    description: Residential demand rises by 40 % for six hours.
    events:
      - name: residential_spike
        start: 86
        duration: 6
        params:
          demand_multiplier:
            residential: 1.4

  weather_shift:
    description: Dense cloud and weak wind reduce renewable output for a day.
    events:
      - name: weather_shift
        start: 72
        duration: 24
        params:
          cloud_override: 0.2
          capacity_factor:
            wind: 0.5

  combined:
    description: A thermal outage and a residential demand spike overlap.
    events:
      - name: combined_outage
        start: 86
        duration: 12
        params:
          capacity_factor:
            thermal: 0.3
      - name: combined_spike
        start: 86
        duration: 6
        params:
          demand_multiplier:
            residential: 1.4
